<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' blob: data: https://i.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<title>블로그 관리 · 미소가든펜션캠핑장</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--paper:#F7F5F1;--ink:#1C1915;--ink2:#4A443C;--stone:#6B6055;--line:rgba(28,25,21,.16);--gold:#8A6A2B;--gold-h:#6F5422;--bad:#B3261E;--good:#2E7D4F;
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);font-size:16px;line-height:1.65;color:var(--ink);background:var(--paper);word-break:keep-all}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:rgba(247,245,241,.96);border-bottom:1px solid var(--line)}
header b{font-weight:700}
header .who{font-size:13px;color:var(--stone)}
main{max-width:860px;margin:0 auto;padding:18px 16px 140px}
.card{border:1px solid var(--line);background:#fff;padding:18px 16px;margin-bottom:14px;border-radius:4px}
.card h2{font-size:17px;margin:0 0 4px}
.hint{font-size:13.5px;color:var(--stone);margin:0 0 12px}
label{display:block;font-size:13.5px;color:var(--ink2);margin:14px 0 5px}
input[type=text],input[type=password],textarea{width:100%;padding:12px 13px;background:var(--paper);border:1px solid var(--line);border-radius:3px;min-height:46px}
textarea{min-height:88px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--gold);background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:0 16px;min-height:44px;border:1px solid var(--gold);color:var(--gold);border-radius:3px;font-size:15px;font-weight:600;background:#fff;text-decoration:none}
.btn:hover{background:var(--gold);color:#fff}
.btn.solid{background:var(--gold);color:#fff}
.btn.solid:hover{background:var(--gold-h)}
.btn.ghost{border-color:var(--line);color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.list a{display:block;padding:12px 4px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.list a:hover{background:var(--paper)}
.list .d{font-size:13px;color:var(--stone)}
.tools{position:sticky;top:57px;z-index:10;display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;background:#fff;border-bottom:1px solid var(--line)}
.tools button{min-height:38px;padding:0 11px;border:1px solid var(--line);border-radius:3px;font-size:14px;background:var(--paper)}
.tools button:hover{border-color:var(--gold)}
.tools button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
#ed{min-height:55vh;padding:14px 4px;outline:none;line-height:1.85}
#ed h2{font-size:1.2rem;margin:30px 0 10px}
#ed h3{font-size:1.05rem;margin:22px 0 8px}
#ed p{margin:0 0 14px}
#ed ul,#ed ol{margin:0 0 14px 22px}
#ed img{display:block;max-width:100%;height:auto;margin:6px 0;border-radius:3px;cursor:pointer}
#ed img[data-sel]{outline:3px solid var(--bad);outline-offset:2px}
#ed table{width:100%;border-collapse:collapse;margin:0 0 14px}
#ed th,#ed td{border:1px solid var(--line);padding:6px 8px}
#raw{min-height:55vh;font-family:Consolas,monospace;font-size:13px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.savebar .msg{font-size:14px;color:var(--ink2);flex:1;min-width:0}
.savebar .msg.ok{color:var(--good)}.savebar .msg.err{color:var(--bad)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><b>미소가든 블로그 관리</b><button class="who" id="who" title="열쇠 바꾸기·끊기">연결 안 됨</button></header>

<main>
  <section class="card" id="gate">
    <h2>열쇠 연결</h2>
    <p class="hint">처음 한 번만 GitHub 토큰을 넣어 주세요. 이 기기에만 저장되고, GitHub 말고는 어디에도 보내지 않습니다.</p>
    <label for="tok">GitHub 토큰</label>
    <input id="tok" type="password" autocomplete="off" placeholder="github_pat_...">
    <div class="row"><button class="btn solid" id="tokSave">연결</button><button class="btn ghost" id="tokClear" hidden>연결 끊기</button></div>
  </section>

  <section class="card" id="listCard" hidden>
    <h2>글 목록</h2>
    <p class="hint">고칠 글을 누르세요. 새 글은 글해줌이 올립니다.</p>
    <div class="list" id="list"></div>
  </section>

  <section class="card" id="edCard" hidden>
    <h2 id="edHead">글 수정</h2>
    <label for="title">제목</label>
    <input id="title" type="text">
    <label for="summary">요약 <small>(블로그 목록·검색 결과에 보이는 설명)</small></label>
    <textarea id="summary"></textarea>
    <label>본문</label>
    <div class="tools">
      <button data-cmd="formatBlock:h2">소제목</button>
      <button data-cmd="formatBlock:p">보통 글</button>
      <button data-cmd="bold">굵게</button>
      <button data-cmd="insertUnorderedList">• 목록</button>
      <button data-cmd="insertOrderedList">1. 목록</button>
      <button id="addImg">사진 넣기</button>
      <button id="delImg">고른 사진 빼기</button>
      <button data-cmd="undo">되돌리기</button>
      <button id="rawBtn">HTML</button>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div id="ed" contenteditable="true"></div>
    <textarea id="raw" hidden></textarea>
  </section>

  <p class="hint">저장하면 1~2분 뒤 홈페이지에 반영됩니다. 안 보이면 새로고침해 주세요 ·
    <a href="/blog.html" target="_blank" rel="noopener">블로그 열기</a> ·
    <a href="https://github.com/choikiho20-cyber/misogarden/commits/main" target="_blank" rel="noopener">변경 기록</a></p>
</main>

<div class="savebar" id="savebar" hidden>
  <span class="msg" id="msg"></span>
  <button class="btn ghost" id="back">목록</button>
  <button class="btn solid" id="save">저장</button>
</div>

<script>
/*LOGIC-START — 글 페이지 고치기 (글해줌 발행기가 이 글을 견본으로 복제하므로 구조는 그대로 두고 값만 바꾼다) */
const RE_BODY=/(<div class="blog-post-content">)([\s\S]*?)(<\/div>\s*<\/article>)/;
const escA=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function getBody(html){const m=html.match(RE_BODY);return m?m[2].trim():null}
function applyEdit(html,{title,summary,body,today}){
  const t=escA(title), s=escA(summary);
  html=html.replace(RE_BODY,(m,a,b,c)=>a+'\n'+body+'\n'+c)
    .replace(/<title>[^<]*<\/title>/,()=>'<title>'+t+'</title>')
    .replace(/<h1>[^<]*<\/h1>/,()=>'<h1>'+t+'</h1>')
    .replace(/(<meta\s+property="og:title"\s+content=")[^"]*"/,(m,a)=>a+t+'"')
    .replace(/(<meta\s+name="description"\s+content=")[^"]*"/,(m,a)=>a+s+'"')
    .replace(/(<meta\s+property="og:description"\s+content=")[^"]*"/,(m,a)=>a+s+'"');
  return html.replace(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g,(m,j)=>{
    let ld; try{ld=JSON.parse(j)}catch(e){return m}
    if(ld['@type']==='Article'){ld.headline=title;ld.description=summary;ld.dateModified=today}
    else if(ld['@type']==='BreadcrumbList'&&(ld.itemListElement||[]).length){ld.itemListElement[ld.itemListElement.length-1].name=title}
    else return m;
    return '<script type="application/ld+json">'+JSON.stringify(ld).replace(/</g,'\\u003c')+'<\/script>';
  });
}
/* 불러온 본문에서 스크립트·on* 속성 제거 (토큰이 이 화면에 있으므로) */
function clean(html){
  const t=document.createElement('template'); t.innerHTML=html;
  t.content.querySelectorAll('script,style').forEach(n=>n.remove());
  t.content.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{
    if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value)||a.name==='data-sel') n.removeAttribute(a.name)}));
  return t.innerHTML;
}
/*LOGIC-END*/

const REPO='choikiho20-cyber/misogarden', BRANCH='main', KEY='miso_gh_token';
const API=`https://api.github.com/repos/${REPO}/contents/`;
const $=id=>document.getElementById(id);
const token=()=>{try{return localStorage.getItem(KEY)||''}catch(e){return ''}};
const b64text=s=>{const u=new TextEncoder().encode(s);let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b)};
const b64dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const today=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10);
let posts=[], cur=null, dirty=false, range=null;
const pending=new Map();   // 화면용 임시 주소 → {path, b64}

async function gh(path,opts={}){
  const r=await fetch(API+path,{cache:'no-store',...opts,headers:{Authorization:'Bearer '+token(),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
  if(!r.ok){const e=new Error(r.status+' '+(await r.text()).slice(0,120));e.status=r.status;throw e}
  return r.json();
}
const put=(path,b64,sha,message)=>gh(path,{method:'PUT',body:JSON.stringify({message,content:b64,branch:BRANCH,...(sha?{sha}:{})})});
function msg(t,kind){const m=$('msg');m.textContent=t;m.className='msg '+(kind||'')}

/* ── 열쇠 ── */
function gate(){
  const on=!!token();
  $('gate').hidden=on; $('listCard').hidden=!on; $('tokClear').hidden=!on; $('edCard').hidden=true; $('savebar').hidden=true;
  $('tok').value=''; $('tok').placeholder=on?'연결됨 — 바꾸시려면 새 토큰 입력':'github_pat_...';
  $('who').textContent=on?'연결됨':'연결 안 됨';
  if(on) loadList();
}
$('tokSave').onclick=async()=>{
  const v=$('tok').value.trim(); if(!v) return alert('토큰을 넣어 주세요.');
  try{localStorage.setItem(KEY,v)}catch(e){return alert('이 브라우저는 저장이 막혀 있습니다.')}
  try{await gh('posts.json?ref='+BRANCH); gate()}
  catch(e){localStorage.removeItem(KEY); alert('연결 실패 — 토큰이나 권한을 확인해 주세요.\n'+e.message)}
};
$('tokClear').onclick=()=>{localStorage.removeItem(KEY);gate()};
$('who').onclick=()=>{if(token())$('gate').hidden=!$('gate').hidden};

/* ── 목록 ── */
async function loadList(){
  $('list').textContent='불러오는 중…';
  try{
    posts=JSON.parse(b64dec((await gh('posts.json?ref='+BRANCH)).content));
    $('list').innerHTML=posts.slice().sort((a,b)=>b.id-a.id).map(p=>
      `<a href="#${p.id}" data-id="${p.id}"><div class="d">${escA(p.date)} · ${p.id}번 글</div>${escA(p.title)}</a>`).join('');
  }catch(e){$('list').textContent='목록을 못 불러왔습니다: '+e.message;return}
  const h=+location.hash.slice(1); if(h&&posts.some(p=>p.id===h)){history.replaceState(null,'',location.pathname);openPost(h)}
}
$('list').onclick=e=>{const a=e.target.closest('a[data-id]');if(!a)return;e.preventDefault();openPost(+a.dataset.id)};

/* ── 편집 ── */
async function openPost(id){
  if(dirty&&!confirm('저장하지 않은 수정이 있습니다. 버리고 다른 글을 열까요?'))return;
  msg('글 불러오는 중…');
  try{
    const html=b64dec((await gh(`posts/${id}.html?ref=${BRANCH}`)).content);
    const body=getBody(html); if(body==null) throw new Error('본문 칸을 찾지 못했습니다');
    const p=posts.find(x=>x.id===id)||{};
    cur={id}; pending.clear(); range=null;
    $('title').value=p.title||''; $('summary').value=p.summary||'';
    $('ed').innerHTML=clean(body); $('raw').hidden=true; $('ed').hidden=false; $('rawBtn').classList.remove('on');
    $('edHead').textContent=id+'번 글 수정';
    $('listCard').hidden=true; $('edCard').hidden=false; $('savebar').hidden=false;
    dirty=false; msg('고친 뒤 [저장]을 누르세요'); scrollTo(0,0);
  }catch(e){msg('글을 못 불러왔습니다: '+e.message,'err')}
}
$('back').onclick=()=>{if(dirty&&!confirm('저장하지 않은 수정이 있습니다. 버리고 목록으로 갈까요?'))return;dirty=false;gate()};
['title','summary','ed','raw'].forEach(k=>$(k).addEventListener('input',()=>{dirty=true}));
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

document.execCommand('defaultParagraphSeparator',false,'p');
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&$('ed').contains(s.anchorNode))range=s.getRangeAt(0).cloneRange()});
function restore(){$('ed').focus();if(range){const s=getSelection();s.removeAllRanges();s.addRange(range)}}
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{
  const [c,v]=b.dataset.cmd.split(':'); restore(); document.execCommand(c,false,v||null); dirty=true;
});
/* 붙여넣기는 글자만 — 다른 사이트 서식이 따라오지 않게 */
$('ed').addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
$('ed').addEventListener('click',e=>{
  $('ed').querySelectorAll('img[data-sel]').forEach(i=>i.removeAttribute('data-sel'));
  if(e.target.tagName==='IMG') e.target.setAttribute('data-sel','');
});
$('delImg').onclick=()=>{
  const i=$('ed').querySelector('img[data-sel]'); if(!i) return alert('뺄 사진을 먼저 눌러 고르세요.');
  const p=i.parentElement; i.remove(); if(p&&p!==$('ed')&&!p.textContent.trim()&&!p.querySelector('img')) p.remove(); dirty=true;
};
$('rawBtn').onclick=()=>{
  const toRaw=$('raw').hidden;
  if(toRaw){$('raw').value=$('ed').innerHTML}else{$('ed').innerHTML=clean($('raw').value)}
  $('raw').hidden=!toRaw; $('ed').hidden=toRaw; $('rawBtn').classList.toggle('on',toRaw);
};

/* ── 사진: 폰 사진도 가로 1600 이하 JPG로 줄여서 넣기 ── */
$('addImg').onclick=()=>{if(!$('raw').hidden)return alert('HTML 보기를 끄고 넣어 주세요.');$('file').click()};
$('file').onchange=async()=>{
  const files=[...$('file').files]; $('file').value=''; if(!files.length) return;
  msg('사진 준비 중…');
  let html='';
  for(const [i,f] of files.entries()){
    try{
      const bm=await createImageBitmap(f,{imageOrientation:'from-image'});
      const k=Math.min(1,1600/bm.width), w=Math.round(bm.width*k), h=Math.round(bm.height*k);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(bm,0,0,w,h);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
      const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(blob)});
      const url=URL.createObjectURL(blob);
      const stamp=today().replace(/-/g,'')+Date.now().toString().slice(-6);
      pending.set(url,{path:`images/posts/${cur.id}_e${stamp}${i}.jpg`,b64});
      html+=`<p><img src="${url}" alt="${escA($('title').value)} 사진" width="${w}" height="${h}" loading="lazy"></p>`;
    }catch(e){alert(f.name+' — 사진을 읽지 못했습니다.')}
  }
  if(html){restore();document.execCommand('insertHTML',false,html);dirty=true;msg('사진은 [저장]할 때 올라갑니다')}
};

/* ── 저장: 사진 → 글 페이지 → posts.json ── */
$('save').onclick=async()=>{
  if(!cur) return;
  if(!$('raw').hidden) $('ed').innerHTML=clean($('raw').value);
  const title=$('title').value.trim(), summary=$('summary').value.trim();
  if(!title) return alert('제목을 넣어 주세요.');
  $('save').disabled=true;
  try{
    const imgs=[...$('ed').querySelectorAll('img')].filter(i=>pending.has(i.getAttribute('src')));
    for(const [n,img] of imgs.entries()){
      msg(`사진 올리는 중… (${n+1}/${imgs.length})`);
      const {path,b64}=pending.get(img.getAttribute('src'));
      await put(path,b64,null,`블로그 사진: ${cur.id}번 글`);
      img.setAttribute('src','/'+path);
    }
    pending.clear();
    $('ed').querySelectorAll('img[data-sel]').forEach(i=>i.removeAttribute('data-sel'));
    const body=$('ed').innerHTML.trim();

    msg('글 페이지 저장 중…');
    const f=await gh(`posts/${cur.id}.html?ref=${BRANCH}`);
    const html=b64dec(f.content), next=applyEdit(html,{title,summary,body,today:today()});
    if(next!==html) await put(`posts/${cur.id}.html`,b64text(next),f.sha,`블로그 수정: ${cur.id}번 글`);

    msg('목록 저장 중…');
    for(let tries=0;;tries++){   // 그사이 글해줌이 새 글을 올렸으면 다시 읽어서 합친다
      const j=await gh('posts.json?ref='+BRANCH), all=JSON.parse(b64dec(j.content));
      const p=all.find(x=>x.id===cur.id);
      if(p){p.title=title;p.summary=summary;p.content=body}
      try{await put('posts.json',b64text(JSON.stringify(all,null,2)),j.sha,`블로그 수정: ${cur.id}번 글 목록`);posts=all;break}
      catch(e){if(tries<2&&(e.status===409||e.status===422))continue;throw e}
    }
    dirty=false;
    msg(`저장 완료 — 1~2분 뒤 misogarden.kr/posts/${cur.id}.html 에 반영됩니다`,'ok');
  }catch(e){msg('저장 실패: '+e.message+' — 다시 [저장]을 눌러 주세요','err')}
  finally{$('save').disabled=false}
};

gate();
</script>
</body>
</html>
